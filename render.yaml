# Render Blueprint — the API service and its Postgres database, together.
#
#   Dashboard -> New -> Blueprint -> connect this repository.
#
# Render reads this file and provisions both resources. The values it cannot
# know are left as `sync: false`, which means "ask me in the dashboard":
#
#   ALLOWED_ORIGINS         a frontend origin other than this service, e.g.
#                           https://paloption.vercel.app (no trailing slash)
#   DARAJA_* credentials    your Daraja app's consumer key/secret/passkey
#   DARAJA_CALLBACK_URL     filled in after the first deploy — the URL contains
#                           this service's own host, which does not exist yet.
#                           See DEPLOY.md §4 for the order of operations.
#
# DATABASE_URL is wired from the database below, so the service never sees an
# in-memory ledger: NODE_ENV=production makes an absent DATABASE_URL a boot error.
#
# NOTE — WHAT THE FREE PLAN COSTS YOU, because free is what this file asks for:
#
#   * a free web service sleeps after about 15 minutes without a request. The
#     trading socket drops with it, the 1-second tick engine stops, and the next
#     visitor waits through a cold start. Open positions are safe — settlement
#     is a guard in the SQL statement, not a timer that a sleeping process
#     holds — but a running auto-trading bot lives in memory and is lost (see
#     the limitation in DEPLOY.md §7).
#   * a free Postgres instance EXPIRES 30 days after creation, then gets a
#     14-day grace period to upgrade before Render deletes it. Move to a paid
#     plan before then or the ledger goes with it. (Both figures are Render's
#     own: https://render.com/docs/free.)
#
# For a deployment that must stay awake, change the two `plan:` values below to
# `starter` (web) and `basic-256mb` (database). Nothing else needs to change.
services:
  - type: web
    name: paloption-api
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: paloption-db
          property: connectionString
      # Leave this EMPTY for the single-origin deployment: this service serves
      # the client itself (site/ is in the repository), so the browser's
      # requests are same-origin and are accepted with no ALLOWED_ORIGINS at
      # all. Measured, not assumed — tools/server.mjs:225 accepts an origin
      # whose host matches the Host the request arrived on.
      #
      # Set it only when the client stays on a different host, e.g.
      # https://paloption.vercel.app, or that host's requests are refused with
      # ORIGIN_NOT_ALLOWED.
      - key: ALLOWED_ORIGINS
        sync: false

      # The USDT (TRC20) wallet depositors are told to send to. THIS ONE MOVES
      # MONEY, so read it before deploying.
      #
      # Left unset, the service falls back to a wallet built into the source
      # (DEFAULT_TRON_DEPOSIT_ADDRESS in tools/payments.mjs) that is NOT YOURS,
      # and every depositor is shown it. Set this to an address you control, or
      # set it to an empty string to switch the static wallet off so the route
      # answers 503 instead of quoting an address nobody here can spend from.
      #
      # It is one shared address, not one per depositor: it cannot tell two
      # depositors apart, so crediting a deposit still needs an on-chain
      # confirmation you verify yourself. See PAYMENTS.md.
      - key: TRON_DEPOSIT_ADDRESS
        sync: false
      # Kept out of the client: the callback path carries this token, and it is
      # the only thing protecting a public route Daraja must reach.
      - key: DARAJA_CALLBACK_TOKEN
        generateValue: true

      # ---------------------------------------------------------------------
      # M-PESA, PHASE 1 — SANDBOX. Nothing here can move real money.
      #
      # Sandbox is a paybill: 174379 is a lipa na m-pesa *paybill* shortcode, and
      # the sandbox does not accept a Buy Goods request against it. So the two
      # switches below start on their paybill values, and `DARAJA_ENV=sandbox`
      # means production credentials are not consulted at all.
      # ---------------------------------------------------------------------
      - key: DARAJA_ENV
        value: sandbox
      - key: DARAJA_TRANSACTION_TYPE
        value: paybill
      - key: DARAJA_PARTY_B
        sync: false

      # ---------------------------------------------------------------------
      # M-PESA, PHASE 2 — GOING LIVE ON A TILL NUMBER. Read this first.
      #
      # A TILL IS NOT A PAYBILL. Buy Goods and PayBill take the same request with
      # exactly one field changed — `CustomerBuyGoodsOnline` versus
      # `CustomerPayBillOnline` — and getting it wrong produces a request
      # Safaricom accepts and your merchant never sees. So these move TOGETHER:
      #
      #   DARAJA_ENV               sandbox    -> production
      #   DARAJA_ALLOW_PRODUCTION  unset      -> 1
      #   DARAJA_TRANSACTION_TYPE  paybill    -> buygoods
      #   DARAJA_SHORTCODE         174379     -> your till number
      #   DARAJA_PARTY_B           (blank)    -> only if the till differs from
      #                                          the business shortcode
      #
      # With production enabled this instance charges a REAL shortcode: anyone
      # who reaches the frontend is sent a real STK prompt, approves it with
      # their real M-Pesa PIN, and pays real money into the operator wallet.
      # Checkout shows the shortcode's registered name on the customer's handset,
      # and this is a clone, not the platform that name belongs to.
      #
      # DARAJA_ALLOW_PRODUCTION is a deliberate second lock: production Daraja is
      # ignored without it, so a copied configuration cannot start taking real
      # payments on its own. The boot log prints `WARNING : Daraja is LIVE` once
      # it is active, so a dashboard shows which instance is taking payments.
      # ---------------------------------------------------------------------
      - key: DARAJA_ALLOW_PRODUCTION
        sync: false
      - key: DARAJA_CALLBACK_URL
        sync: false
      - key: DARAJA_CONSUMER_KEY
        sync: false
      - key: DARAJA_CONSUMER_SECRET
        sync: false
      - key: DARAJA_SHORTCODE
        sync: false
      - key: DARAJA_PASSKEY
        sync: false

databases:
  - name: paloption-db
    plan: free
    postgresMajorVersion: "16"
