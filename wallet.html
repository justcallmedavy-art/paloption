<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="./dist/styles.css" />
    <title>Deposit - StrategyOption</title>
    <meta name="description" content="Add funds to your StrategyOption account" />
    <link rel="icon" href="./favicon.ico" sizes="32x32" type="image/x-icon" />
  </head>
  <body class="antialiased font-sans bg-page text-primary min-h-screen">
    <header class="sticky top-0 z-40 border-b border-line bg-panel/85 backdrop-blur-xl">
      <div class="flex items-center justify-between gap-3 px-4 h-14">
        <a href="index.html" class="flex items-center gap-2.5 shrink-0">
          <div class="w-8 h-8 rounded-lg flex items-center justify-center" style="background: linear-gradient(135deg, #ff4d2e, #2563eb)">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-[17px] h-[17px] text-white"><polyline points="22 7 13.5 15.5 8.5 10.5 2 17" /><polyline points="16 7 22 7 22 13" /></svg>
          </div>
          <span class="text-[17px] font-bold text-primary">StrategyOption</span>
        </a>
        <div class="flex items-center gap-3">
          <div class="text-right">
            <div class="text-[10px] uppercase tracking-wider text-subtle" data-context>Demo Account</div>
            <div class="text-sm font-bold tabular-nums text-primary" data-balance>$0.00</div>
          </div>
          <a href="trade.html" class="px-3.5 py-2 text-xs font-semibold rounded-lg border border-line text-primary hover:bg-white/5 transition">Back to trading</a>
        </div>
      </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 py-8 grid gap-6 lg:grid-cols-[1fr_1fr]">
      <section class="rounded-2xl p-6 bg-panel border border-line">
        <h1 class="text-xl font-bold text-primary">Deposit</h1>
        <p class="mt-1 text-xs text-subtle">This build is a local demo: no money moves, and every credit is recorded in this browser only.</p>

        <div class="mt-6">
          <div class="text-[11px] font-bold uppercase tracking-wider text-subtle mb-2">Method</div>
          <div class="grid grid-cols-2 gap-1.5" id="methods">
            <button data-method="Demo credit" class="method-btn px-3 py-2 rounded-lg text-xs font-semibold border border-[#FF4D2E] bg-[#FF4D2E] text-white transition">Demo credit</button>
            <button data-method="M-Pesa (simulated)" class="method-btn px-3 py-2 rounded-lg text-xs font-semibold border border-line bg-field text-muted transition">M-Pesa (simulated)</button>
          </div>
        </div>

        <div class="mt-5">
          <div class="text-[11px] font-bold uppercase tracking-wider text-subtle mb-2">Amount</div>
          <input id="amount" type="number" min="1" step="1" value="100" class="w-full h-11 bg-field border border-line rounded-lg px-3 text-sm font-semibold text-primary focus:outline-none focus:ring-2 focus:ring-[#FF4D2E]/40" />
          <div class="flex gap-1.5 mt-2">
            <button data-amount="50" class="flex-1 py-1.5 rounded-md border border-line bg-field text-[11px] font-semibold text-muted">$50</button>
            <button data-amount="100" class="flex-1 py-1.5 rounded-md border border-line bg-field text-[11px] font-semibold text-muted">$100</button>
            <button data-amount="500" class="flex-1 py-1.5 rounded-md border border-line bg-field text-[11px] font-semibold text-muted">$500</button>
            <button data-amount="1000" class="flex-1 py-1.5 rounded-md border border-line bg-field text-[11px] font-semibold text-muted">$1,000</button>
          </div>
        </div>

        <div id="warning" class="hidden mt-4 px-3 py-2 rounded-lg bg-amber-500/10 border border-amber-500/20 text-[11px] text-amber-500">Enter an amount of at least $1.</div>

        <button id="deposit" class="mt-5 w-full h-11 rounded-lg text-sm font-bold text-white transition" style="background: #ff4d2e">Deposit</button>
        <p id="status" class="mt-3 text-[11px] text-subtle"></p>
      </section>

      <section class="rounded-2xl p-6 bg-panel border border-line">
        <h2 class="text-sm font-bold text-primary">Recent activity</h2>
        <div id="transactions" class="mt-4"></div>
      </section>
    </main>

    <script src="./js/app.js"></script>
    <script src="./js/wallet.js"></script>
  </body>
</html>
